[package]
name = "quorum-vault-client"
version = "1.0.1"
edition = "2021"
repository = "https://github.com/MaximFischuk/quorum-vault-client"
documentation = "https://docs.rs/quorum-vault-client"
description = "A Rust client for Quorum Vault Plugin"
authors = ["Maxim Fischuk <maximusfk@gmail.com>"]
readme = "README.md"
license = "MIT"

[dependencies]
vaultrs = "0.8.0"
web3 = "0.19.0"
derive_builder = "0.20.2"
thiserror = "2.0.18"
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.149"
rustify = "0.7.0"
rustify_derive = "0.5.5"
eth_checksum = "0.1.2"
base64 = "0.22.1"
hex = "0.4.3"

[dev-dependencies]
tokio = { version = "1.51.0", features = ["full"] }
wiremock = "0.6.5"
secp256k1 = "0.31.1"
